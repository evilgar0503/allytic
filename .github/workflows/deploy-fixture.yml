name: Deploy broken-site fixture

on:
  push:
    branches: [main]
    paths:
      - "fixtures/broken-site/**"
      - ".github/workflows/deploy-fixture.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-fixture
  cancel-in-progress: false

env:
  PAGES_PROJECT: allytic-broken-site

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Create the Pages project on first run
        run: |
          if ! pnpm exec wrangler pages project list | grep -q "$PAGES_PROJECT"; then
            pnpm exec wrangler pages project create "$PAGES_PROJECT" --production-branch=main
          fi

      # Direct upload: does not consume the 500 builds/month of the Pages Free plan.
      - name: Deploy
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: >
          pnpm exec wrangler pages deploy fixtures/broken-site
          --project-name="$PAGES_PROJECT"
          --branch=main
          --commit-dirty=true

      - name: Smoke test the deployment
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          url=$(node -e '
            const lines = require("node:fs").readFileSync(process.env.WRANGLER_OUTPUT_FILE_PATH, "utf8").split("\n").filter(Boolean);
            const deploy = lines.map((line) => JSON.parse(line)).find((entry) => entry.type === "pages-deploy");
            if (!deploy?.url) { console.error("No pages-deploy entry in wrangler output"); process.exit(1); }
            console.log(deploy.url);
          ')
          echo "Deployment URL: $url" | tee -a "$GITHUB_STEP_SUMMARY"
          for page in index.html forms.html media.html styles.css; do
            # A fresh deployment hostname can take a minute or two to get its TLS certificate.
            curl --fail --silent --show-error --location --retry 15 --retry-all-errors --retry-delay 10 \
              --output /dev/null "$url/$page"
            echo "OK $page"
          done
