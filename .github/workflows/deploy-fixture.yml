name: Deploy broken-site fixture

on:
  push:
    branches: [main]
    paths:
      - "fixtures/broken-site/**"
      - ".github/workflows/deploy-fixture.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-fixture
  cancel-in-progress: false

env:
  PAGES_PROJECT: allytic-broken-site

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Create the Pages project on first run
        run: |
          if ! pnpm exec wrangler pages project list | grep -q "$PAGES_PROJECT"; then
            pnpm exec wrangler pages project create "$PAGES_PROJECT" --production-branch=main
          fi

      # Direct upload: does not consume the 500 builds/month of the Pages Free plan.
      - name: Deploy
        run: >
          pnpm exec wrangler pages deploy fixtures/broken-site
          --project-name="$PAGES_PROJECT"
          --branch=main
          --commit-dirty=true
